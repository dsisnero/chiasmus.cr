# Keep git submodules materialized at the recorded commit in every worktree.
# Symlinking tracked submodule directories across worktrees is unsafe because
# git expects each worktree/submodule checkout to own its own working tree.
#
# Copy dotfiles and root-level config files from the parent repo into every
# new worktree.  git checkout only tracks committed blobs; project-local
# configuration (linter settings, editor config, CI workflows) lives outside
# the branch and must be seeded explicitly.
#
# `pre-start` gives a blocking best-effort check on worktree creation.
# `post-start` repairs freshly-created worktrees after checkout.
# `post-switch` and `post-merge` repair branch moves that change submodule SHAs.

[pre-start]
dotfiles = "./scripts/wktrees_copy_dotfiles.sh"
submodules = "./scripts/wktrees_sync_vendor.sh"

[post-start]
submodules = "./scripts/wktrees_sync_vendor.sh"

[post-switch]
submodules = "./scripts/wktrees_sync_vendor.sh"

[post-merge]
submodules = "./scripts/wktrees_sync_vendor.sh"
