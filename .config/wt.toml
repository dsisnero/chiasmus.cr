# Keep git submodules materialized at the recorded commit in every worktree.
#
# pre-start:  blocking — submodule sync before worktree is usable.
# post-start: background — copy gitignored files from primary, then build.
# post-switch / post-merge: repair submodule SHAs after branch changes.

[pre-start]
submodules = "git submodule sync --recursive && git submodule update --init --recursive --checkout"

# Pipeline: copy gitignored build/config files from primary worktree first,
# then build the chiasmus binary (needs submodules already materialized).
[[post-start]]
copy-ignored = "wt step copy-ignored"

[[post-start]]
build-chiasmus = "CRYSTAL_CACHE_DIR=$PWD/.crystal-cache make build"

[post-switch]
submodules = "git submodule sync --recursive && git submodule update --init --recursive --checkout"

[post-merge]
submodules = "git submodule sync --recursive && git submodule update --init --recursive --checkout"
