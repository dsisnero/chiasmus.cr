name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,   arch: x86_64,  ext: "" }
          - { os: macos-latest,    arch: aarch64, ext: "" }
          - { os: windows-latest,  arch: x86_64,  ext: ".exe" }

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Initialize build grammars
      shell: bash
      run: bash scripts/init_build_grammars.sh

    - name: Setup Crystal
      uses: crystal-lang/install-crystal@v1
      with:
        crystal: latest

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Test release workflow contract
      run: python scripts/test_release_workflows.py

    - name: Test release manifest contract
      run: python scripts/test_release_manifest.py

    # Platform-specific system dependencies (matching CI installs)
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgmp-dev libssl-dev pkg-config liblzma-dev swi-prolog
        git clone --depth 1 --branch v0.26.8 https://github.com/tree-sitter/tree-sitter.git /tmp/tree-sitter-lib
        cd /tmp/tree-sitter-lib && make && sudo make install && sudo ldconfig

    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      run: |
        brew install gmp openssl pkg-config tree-sitter xz swi-prolog

    - name: Install Windows dependencies
      if: runner.os == 'Windows'
      shell: bash
      run: |
        # Build tree-sitter C library from source using cmake (MSVC)
        git clone --depth 1 --branch v0.26.8 https://github.com/tree-sitter/tree-sitter.git /tmp/tree-sitter-lib
        cd /tmp/tree-sitter-lib
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
        cmake --build build --config Release
        cmake --install build --prefix /c/tree-sitter
        # Show what was installed
        find /c/tree-sitter -name "*.lib" -o -name "*.dll" 2>/dev/null
        # Add to LIB/INCLUDE for Crystal compiler linking (MSVC-style)
        echo "LIB=/c/tree-sitter/lib" >> $GITHUB_ENV
        echo "INCLUDE=/c/tree-sitter/include" >> $GITHUB_ENV

    - name: Install tree-sitter CLI
      uses: baptiste0928/cargo-install@v3
      with:
        crate: tree-sitter-cli

    - name: Install dependencies
      run: shards install

    - name: Compile grammar libraries
      run: crystal run scripts/setup_grammars.cr

    - name: Build binaries
      shell: bash
      run: |
        mkdir -p dist/chiasmus/grammars
        # Windows: copy tree-sitter.lib into Crystal's bundled lib dir so the linker finds it
        if [ "${{ runner.os }}" = "Windows" ]; then
          CRYSTAL_LIB=$(dirname $(command -v crystal))/../lib
          cp /c/tree-sitter/lib/tree-sitter.lib "$CRYSTAL_LIB/" 2>/dev/null || true
          echo "Copied tree-sitter.lib to $CRYSTAL_LIB"
          ls "$CRYSTAL_LIB"/tree-sitter.lib 2>/dev/null || echo "Copy failed, trying alternative path"
          # Fallback: also put it next to the source
          cp /c/tree-sitter/lib/tree-sitter.lib . 2>/dev/null || true
        fi
        crystal build --release -o dist/chiasmus/chiasmus${{ matrix.ext }} src/chiasmus_cli.cr
        crystal build --release -o dist/chiasmus/chiasmus-discover${{ matrix.ext }} src/chiasmus_discover.cr
        crystal build --release -o dist/chiasmus/chiasmus-grammar${{ matrix.ext }} src/chiasmus_grammar.cr
        crystal build --release -o dist/chiasmus/chiasmus-parity${{ matrix.ext }} src/chiasmus_parity.cr
        crystal build --release -o dist/chiasmus/chiasmus-facts${{ matrix.ext }} src/chiasmus_facts.cr
        crystal build --release -o dist/chiasmus/chiasmus-plan${{ matrix.ext }} src/chiasmus_plan.cr
        crystal build --release -o dist/chiasmus/chiasmus-complete${{ matrix.ext }} src/chiasmus_complete.cr

    - name: Copy grammar libraries
      shell: bash
      run: |
        case "${{ runner.os }}" in
          macOS)   ext=dylib ;;
          Linux)   ext=so ;;
          Windows) ext=dll ;;
        esac
        for lang in ruby python java go rust scala javascript typescript tsx crystal; do
          lib=libtree-sitter-$lang.$ext
          grammar_file=$(find grammars -name "$lib" -print -quit)
          if [ -n "$grammar_file" ]; then
            cp "$grammar_file" dist/chiasmus/grammars/
          else
            echo "Warning: $lib not found"
          fi
        done
        ls dist/chiasmus/grammars/

    - name: Create and verify toolchain manifest
      shell: bash
      run: |
        case "${{ runner.os }}" in
          macOS) platform="darwin-${{ matrix.arch }}" ;;
          Linux) platform="linux-${{ matrix.arch }}" ;;
          Windows) platform="windows-${{ matrix.arch }}" ;;
        esac
        python scripts/release_manifest.py create \
          --root dist/chiasmus \
          --platform "$platform" \
          --source-commit "${{ github.sha }}" \
          --build-id "${{ github.sha }}-${platform}-${{ github.run_id }}-${{ github.run_attempt }}" \
          --capabilities-json '{"discover":["tree-sitter"],"facts":["typed-declarations"],"parity":["bundle","typed-declarations","maps-prolog","surfaces"],"plan":[],"complete":[]}' \
          --schemas-json '{"extraction_cache":"5","declaration_id":"v1","port_concept":1,"report":1}'
        python scripts/release_manifest.py verify \
          --root dist/chiasmus --platform "$platform" \
          --require-capability discover.tree-sitter \
          --require-capability facts.typed-declarations \
          --require-capability parity.bundle

    - name: Package (unix)
      if: runner.os != 'Windows'
      run: |
        cd dist
        tar czf ../chiasmus-${{ runner.os }}-${{ matrix.arch }}-${{ github.ref_name }}.tar.gz chiasmus/

    - name: Package (windows)
      if: runner.os == 'Windows'
      run: |
        cd dist
        7z a ../chiasmus-${{ runner.os }}-${{ matrix.arch }}-${{ github.ref_name }}.zip chiasmus/

    - name: Verify and smoke-test packaged archive
      shell: bash
      run: |
        mkdir -p unpacked
        case "${{ runner.os }}" in
          macOS)
            platform="darwin-${{ matrix.arch }}"
            tar -xzf chiasmus-${{ runner.os }}-${{ matrix.arch }}-${{ github.ref_name }}.tar.gz -C unpacked
            ;;
          Linux)
            platform="linux-${{ matrix.arch }}"
            tar -xzf chiasmus-${{ runner.os }}-${{ matrix.arch }}-${{ github.ref_name }}.tar.gz -C unpacked
            ;;
          Windows)
            platform="windows-${{ matrix.arch }}"
            7z x chiasmus-${{ runner.os }}-${{ matrix.arch }}-${{ github.ref_name }}.zip -ounpacked
            ;;
        esac
        python scripts/release_manifest.py verify \
          --root unpacked/chiasmus --platform "$platform" \
          --require-capability discover.tree-sitter \
          --require-capability facts.typed-declarations \
          --require-capability parity.bundle
        python scripts/release_smoke.py --root unpacked/chiasmus --platform "$platform"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: chiasmus-${{ runner.os }}-${{ matrix.arch }}
        path: chiasmus-${{ runner.os }}-${{ matrix.arch }}-${{ github.ref_name }}.*

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true
    - run: ls -laR artifacts/
    - run: cd artifacts && sha256sum chiasmus-* > SHA256SUMS
    - uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
